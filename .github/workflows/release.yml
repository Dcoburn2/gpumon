name: release

# Build the Windows artifacts on a tag, sign them if a signing identity is
# configured, and attach them to the release.
#
# Signing belongs here rather than on somebody's laptop: a certificate's private
# key must live in a hardware module or a cloud service, and continuous
# integration is where those belong. Nothing in this workflow is required for a
# build to succeed - unsigned artifacts are still released, with a note.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    # The suite takes about 6 minutes on a fast machine with three GPUs; a
    # two-core runner with none is several times slower. Bounded so a run that
    # goes wrong ends as a failure rather than sitting there looking stuck - the
    # first attempt was cancelled by hand after half an hour.
    timeout-minutes: 45
    env:
      # Kept in an environment variable because `secrets` cannot appear in an
      # `if:` condition: GitHub rejects such a workflow as invalid, and it fails
      # before any job starts, which is what happened to the first version of
      # this file. The `env` context is allowed there.
      SIGNING_METADATA: ${{ secrets.AZURE_SIGNING_METADATA }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller psutil wmi pyyaml

      - name: Build the artifacts
        # Built before the suite runs, because part of the suite checks the built
        # artifacts: the checksum files, and the licences inside them, only exist
        # once something has been built. Testing first is what made the first
        # attempt at this workflow fail on a clean runner.
        run: python scripts/make_release.py --all
        shell: pwsh

      - name: Run the test suite
        # Each test runs with its own bound, so a test that blocks names itself
        # instead of hanging the job. The slowest locally is 63 seconds.
        #
        # A failure is reported as two things: the output in the log, and an
        # annotation carrying the failing lines, because the annotations are
        # readable through the API without a token and the log is not. That is how
        # a runner-only failure gets diagnosed without asking anyone to copy text
        # out of a web page.
        #
        # GPUMON_SKIP_MACHINE_TESTS stops the tests that measure this machine
        # rather than the program: they assert that NVIDIA's and AMD's libraries
        # are installed, that the sensor driver is present, that a window is
        # visible and scrollable, and that three GPUs are enumerable. A runner has
        # none of that, and a red build caused by absent hardware trains everybody
        # to ignore red. They run in full on a machine that has the hardware -
        # which is where they were written and where they have always passed.
        env:
          GPUMON_SKIP_MACHINE_TESTS: "1"
        run: |
          $failed = 0
          Get-ChildItem tests/test_*.py | ForEach-Object {
            $name = $_.Name
            $job = Start-Job -ScriptBlock {
              param($path, $skip)
              Set-Location $using:pwd
              if ($skip) { $env:GPUMON_SKIP_MACHINE_TESTS = $skip }
              & python $path 2>&1
              "EXIT=$LASTEXITCODE"
            } -ArgumentList $_.FullName, $env:GPUMON_SKIP_MACHINE_TESTS
            if (Wait-Job $job -Timeout 300) {
              $out = Receive-Job $job
              $code = ($out | Select-String '^EXIT=' | Select-Object -Last 1)
              $text = ($out | Where-Object { $_ -notmatch '^EXIT=' }) -join "`n"
              Write-Host "== $name"
              Write-Host $text
              if ($code -notmatch 'EXIT=0') {
                $failed = 1
                $why = ($out | Select-String 'FAIL|Error|Traceback' |
                        Select-Object -First 6) -join ' | '
                Write-Host "::error title=$name::$($why -replace '%','%25' -replace "`r",'' -replace "`n",' | ')"
              }
            } else {
              Stop-Job $job
              Write-Host "== $name"
              Write-Host "::error title=$name::did not finish within 300 seconds"
              $failed = 1
            }
            Remove-Job $job -Force
          }
          python gpumon.py --selftest
          if ($LASTEXITCODE -ne 0) { $failed = 1 }
          exit $failed
        shell: pwsh

      - name: Sign the artifacts
        # Azure Artifact Signing (formerly Trusted Signing) is the option
        # Microsoft recommends for distribution outside the Store: about
        # $9.99/month, no hardware token, and it integrates with a pipeline.
        # The secrets below hold the dlib path and its metadata; without them
        # this step is skipped and the build stays unsigned.
        if: env.SIGNING_METADATA != ''
        env:
          GPUMON_SIGN_ARGS: >-
            /dlib ${{ secrets.AZURE_SIGNING_DLIB }}
            /dmdf ${{ secrets.AZURE_SIGNING_METADATA }}
        run: python scripts/make_release.py --sign
        shell: pwsh

      - name: Note that the build is unsigned
        if: env.SIGNING_METADATA == ''
        run: |
          Write-Host "::warning::No signing identity configured, so these"
          Write-Host "::warning::artifacts are unsigned and Windows will warn"
          Write-Host "::warning::on first run. See the Signing section of README.md."
        shell: pwsh

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gpumon-windows-x64
          path: |
            release/**
            release-onefile/**
            gpumon-*-windows-x64.zip

      - name: Attach them to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # The zip and the checksum *of the zip*. It used to publish
          # release/SHA256SUMS.txt, which is the checksum of gpumon.exe inside the
          # archive - so anyone who verified the download against it got a
          # mismatch and concluded the download was corrupt. A checksum has to
          # describe the file it is published beside.
          #
          # The single-file build is published too: the same program as one
          # executable, for anyone who would rather not unpack a folder.
          files: |
            gpumon-*-windows-x64.zip
            gpumon-*-windows-x64.zip.sha256
            gpumon-*-windows-x64.exe
            gpumon-*-windows-x64.exe.sha256
          body: |
            Windows 10/11, 64-bit. Two downloads, the same program:

            * **`gpumon-<version>-windows-x64.zip`** — unzip it and run
              `gpumon.exe`. Starts immediately; keep the folder together.
            * **`gpumon-<version>-windows-x64.exe`** — one file, put it anywhere
              and run it. It unpacks itself at each start, which costs about half
              a second.

            Each has a `.sha256` beside it holding that file's SHA-256:

            ```powershell
            (Get-FileHash .\gpumon-1.0.5-windows-x64.exe -Algorithm SHA256).Hash
            ```

            Inside the zip, `SHA256SUMS.txt` does the same for the `gpumon.exe`
            within it, once unzipped.

            Neither download is code-signed, so Windows will show a
            "Windows protected your PC" notice the first time — *More info →
            Run anyway*.
